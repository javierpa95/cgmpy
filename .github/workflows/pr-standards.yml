name: PR Standards

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Only keep the conventional-commits title validator. The other jobs
# (changelog reminder, size labels, large-PR warning) were noisy for a
# single-maintainer project and duplicated the rules already documented
# in AGENTS.md §3 (Documentation Golden Rule) and §6 (small focused PRs).
jobs:
  conventional-commits:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional Commits (feat, fix, ...) at the start of the PR title.
          # Single source of truth: pyproject.toml / .opencode/rules/
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert
          requireScope: true
          scopes: |
            data
            metrics
            plotting
            analysis
            agata
            utils
            docs
            ci
            deps
            release
            agents
            examples
            tests
            harness
            tooling
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject must start with a lower-case letter (imperative mood).
