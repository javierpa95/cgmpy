name: Check Line Endings

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-line-endings:
    name: Enforce LF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for CRLF
        run: |
          echo "Checking for CRLF line endings in tracked files..."
          # Find any tracked file that contains CRLF.
          BAD=$(git ls-files -z | xargs -0 -I {} sh -c 'file "{}" | grep -q CRLF && echo "{}"' 2>/dev/null)
          if [ -n "$BAD" ]; then
            echo "::error::The following files have CRLF line endings (should be LF):"
            echo "$BAD"
            exit 1
          fi
          echo "✅ All tracked files use LF line endings."

      - name: Check for BOM
        run: |
          echo "Checking for UTF-8 BOM in tracked files..."
          BAD=$(git ls-files -z | xargs -0 -I {} sh -c 'head -c 3 "{}" | xxd | grep -q "efbbbf" && echo "{}"' 2>/dev/null)
          if [ -n "$BAD" ]; then
            echo "::error::The following files have a UTF-8 BOM (should not):"
            echo "$BAD"
            exit 1
          fi
          echo "✅ No tracked files have a UTF-8 BOM."
