name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# NOTE: This workflow requires the repo-level setting
#   Settings -> Actions -> General -> Workflow permissions
#       -> "Allow GitHub Actions to create and approve pull requests"
# to be ENABLED. Without it, the action exits with
# "GitHub Actions is not permitted to create or approve pull requests"
# (REST API error 422). This is a one-time click in the GitHub UI and
# cannot be set from a workflow file.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # All package-level config (release-type, package-name,
          # changelog-path, extra-files) lives in release-please-config.json
          # so the action does not duplicate it here. See
          # release-please-config.json and .release-please-manifest.json.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Print release outputs
        if: steps.release.outputs.release_created
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          echo "Released $TAG at $SHA"
          echo "Run the publish-pypi workflow to push to PyPI:"
          echo "  gh workflow run publish-pypi.yml -f tag=$TAG"
